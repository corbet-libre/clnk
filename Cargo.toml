[package]
name = "clnk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Link for device-side community composition"
repository = "https://github.com/corbet-foss/clnk"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[lib]
crate-type = ["rlib"]

[features]
default = ["http"]
http = ["cfrm/client-http"]
browser = ["cfrm/client-browser"]

[dependencies]
cmbl = { git = "https://github.com/corbet-foss/cmbl", branch = "main" }
cmmr = { git = "https://github.com/corbet-foss/cmmr", branch = "main" }
cswb = { git = "https://github.com/corbet-foss/cswb", branch = "main" }
serde_json = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
schemars = "1"
cfrm = { git = "https://github.com/corbet-libs/cfrm", branch = "main", default-features = false }

[dev-dependencies]
futures-executor = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".ci/coverage-runtime" }
wasm-bindgen-test = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }
