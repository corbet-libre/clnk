[package]
name = "clnk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Link for device-side community composition"
repository = "https://github.com/corbet-foss/clnk"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "1"
cfrm = { git = "https://github.com/corbet-libs/cfrm", branch = "main", default-features = false }

[dev-dependencies]
futures-executor = "0.3"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
