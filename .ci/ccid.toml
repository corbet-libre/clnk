schema = 1
project = "clnk"
repository = "https://git.corbet.ch/corbet-foss/clnk.git"

# Preserved hosted Linux gates live here; no pre-existing .ci/ccid.toml existed,
# so every hosted Linux check below is the preserved contract (resolve/cargo-update
# excluded per prior-cohort rule; registry/live reads stay FRESH outside cache).
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["python3", "-m", "pip", "--version"], ["curl", "--version"], ["wasm-pack", "--version"], ["chromedriver", "--version"], ["google-chrome", "--version"], ["clang", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "wasm-coverage.json", "wasm-coverage.lcov", "wasm-coverage.txt"]

[checks.native]
kind = "commands"
commands = [["bash", ".ci/native.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_outputs = ["dependency-metadata.json"]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock"]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "clnk"

[jobs.native]
scheduler = "crow"
checks = ["native"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[jobs.resolve-dependencies]
scheduler = "crow"
checks = ["resolve-dependencies"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
